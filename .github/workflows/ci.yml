name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config wayland-protocols libwayland-dev libvulkan-dev
      - name: Build
        run: make
      - name: Check
        run: make check
      - name: Ensure all src/ compiled
        run: |
          for f in src/*.c; do
            nm bin/*.o | grep $(basename $f .c) || (echo "$f not compiled" && exit 1)
          done
      - name: Ensure no generated files committed
        run: |
          git ls-files bin/wayland-protocols-client.h bin/wayland-protocols-code.c && exit 1 || exit 0